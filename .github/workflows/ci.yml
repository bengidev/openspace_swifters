# CI workflow for OpenSpace.
#
# Runs on every pull request and on push to the default branch. Three jobs:
#   - build : xcodebuild build  against the OpenSpace scheme on an iOS 17.6
#             simulator destination.
#   - test  : xcodebuild test   for the OpenSpaceTests unit-test target only.
#             UI tests are intentionally excluded from CI; users/developers
#             run UI smoke tests manually on simulator/device.
#   - lint  : swiftlint against the repo's .swiftlint.yml, failing on any
#             violation (--strict).
#
# Branch-protection rules that *require* these checks are configured via the
# GitHub UI ruleset by a maintainer (see CONTRIBUTING.md). This workflow only
# declares the jobs; making them mandatory is a separate, manual step.
#
# Tracked by issue #32 (P0: CI workflow — build, test, lint on PR and main).

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: OpenSpace/OpenSpace.xcodeproj
  XCODE_SCHEME: OpenSpace
  # Hardcoding a simulator name (e.g. "iPhone 16") breaks whenever
  # GitHub rolls the macos-15 runner image and drops/renames that
  # device. Instead each job resolves a concrete, available iPhone
  # simulator UDID at runtime via `select-simulator` and exports it as
  # XCODE_DESTINATION. Minimum deployment target compliance is enforced
  # at compile time by Swift availability checks, not by which simulator
  # runtime the binary runs on.
  DERIVED_DATA: build/DerivedData

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-build-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-build-
            spm-${{ runner.os }}-

      - name: Select an available iOS Simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys;ds=json.load(sys.stdin)["devices"];print(next((d["udid"] for rt in sorted(ds) if "iOS" in rt for d in ds[rt] if d.get("isAvailable") and "iPhone" in d["name"]), ""))')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator UDID: $UDID"
          echo "XCODE_DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      - name: xcodebuild build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$XCODE_DESTINATION" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-test-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-test-
            spm-${{ runner.os }}-

      - name: Select an available iOS Simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys;ds=json.load(sys.stdin)["devices"];print(next((d["udid"] for rt in sorted(ds) if "iOS" in rt for d in ds[rt] if d.get("isAvailable") and "iPhone" in d["name"]), ""))')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator UDID: $UDID"
          echo "XCODE_DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      - name: xcodebuild unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$XCODE_DESTINATION" \
            -only-testing:OpenSpaceTests \
            -skip-testing:OpenSpaceUITests \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        # SwiftLint is preinstalled on macos-15 runners; keep an explicit
        # `brew install` as a no-op safety net so a future image change does
        # not silently turn the lint job into a "command not found" pass.
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      - name: swiftlint lint
        run: swiftlint lint --strict --reporter github-actions-logging
